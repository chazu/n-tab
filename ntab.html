<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>NTab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>NTab</h1>
    <span id="count"></span>
    <span class="spacer"></span>
    <button id="restore-all">Restore all</button>
    <button id="clear-all" class="danger">Delete all</button>
  </header>
  <p id="empty" hidden>Nothing here yet. Tabs beyond your limit will show up in this list.</p>
  <ul id="list"></ul>
  <script src="ntab.js"></script>
</body>
</html>
